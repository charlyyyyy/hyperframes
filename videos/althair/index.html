<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0f2c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0.05;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="etoile"
        data-composition-id="etoile"
        data-composition-src="compositions/etoile.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="tete"
        data-composition-id="tete"
        data-composition-src="compositions/tete.html"
        data-start="6"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="coeur"
        data-composition-id="coeur"
        data-composition-src="compositions/coeur.html"
        data-start="13"
        data-duration="7.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="fond"
        data-composition-id="fond"
        data-composition-src="compositions/fond.html"
        data-start="20.5"
        data-duration="7.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="final"
        data-composition-id="final"
        data-composition-src="compositions/final.html"
        data-start="28"
        data-duration="6.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <svg id="grain" data-layout-ignore width="1080" height="1920" viewBox="0 0 1080 1920">
        <filter id="grain-f">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="1080" height="1920" filter="url(#grain-f)" />
      </svg>

      <!-- Sound effects: one lane (a second only where two overlap) -->
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="1.2" data-duration="1.8" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-dive" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="3.4" data-duration="3.4" data-track-index="10" data-volume="0.75" data-fade-out="0.5"></audio>
      <audio id="sfx-splash" class="clip" src="assets/sfx/pop.mp3" data-start="6.52" data-duration="0.72" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-spin" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.62" data-duration="0.57" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-roll" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="15.6" data-duration="0.57" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-wipe" class="clip" src="assets/sfx/whoosh.mp3" data-start="20.15" data-duration="0.57" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-flood" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="25.25" data-duration="3.2" data-track-index="10" data-volume="0.7" data-fade-out="0.5"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="28.68" data-duration="2.5" data-media-start="1" data-track-index="11" data-volume="0.3" data-fade-in="0.4" data-fade-out="0.15"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="31.16" data-duration="2.59" data-track-index="10" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
