  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set(["#tt-l2 .w"], { opacity: 0 });

    // The bergamot slice falls into the light and splashes.
    tl.fromTo("#tt-berg", { y: -1500, rotation: -140 }, { y: 0, rotation: 0, duration: 0.62, ease: "power3.in" }, 0);
    tl.fromTo("#tt-berg", { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.55)", immediateRender: false }, 0.62);
    tl.fromTo("#tt-sun", { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, duration: 1.2, ease: "expo.out", transformOrigin: "50% 50%" }, 0.5);
    document.querySelectorAll("#tt-drops .tt-drop").forEach((d, i) => {
      const a = parseFloat(d.dataset.a);
      const dist = 400 + (i % 4) * 70;
      tl.fromTo(d, { x: Math.cos(a) * 250, y: Math.sin(a) * 250, opacity: 0 }, { x: Math.cos(a) * dist, y: Math.sin(a) * dist + 90, opacity: 0.95, duration: 0.55, ease: "expo.out" }, 0.62);
      tl.to(d, { opacity: 0, y: Math.sin(a) * dist + 250, duration: 0.45, ease: "power2.in" }, 1.05 + (i % 5) * 0.04);
    });
    // Slow turn of the slice while it is shown (constant speed is the point).
    tl.fromTo("#tt-berg", { rotation: 0 }, { rotation: 32, duration: 5.55, ease: "none", immediateRender: false }, 0.62);

    tl.fromTo("#tt-chip", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0.55);
    tl.fromTo("#tt-l1 .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.out", stagger: 0.09 }, 0.75);

    // Mandarin rolls in from the right.
    tl.fromTo("#tt-mand", { x: 560, rotation: 160 }, { x: 0, rotation: 0, duration: 1.0, ease: "expo.out" }, 1.6);

    // Swap to elemi; resin tears set down.
    tl.to("#tt-l1 .w", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", stagger: 0.04 }, 3.2);
    tl.fromTo("#tt-l2 .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.out", stagger: 0.08 }, 3.45);
    tl.fromTo("#tt-resins .tt-resin", { scale: 0.01, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.12, transformOrigin: "50% 100%" }, 3.5);

    // Exit: everything leaves, the slice spins shut into a point, terracotta opens from it.
    tl.to(["#tt-chip", "#tt-l2"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 6.05);
    tl.to("#tt-mand", { x: 700, rotation: 200, duration: 0.5, ease: "power3.in" }, 6.1);
    tl.to("#tt-resins", { y: 600, duration: 0.5, ease: "power3.in" }, 6.1);
    tl.to("#tt-berg", { scale: 0.02, rotation: 332, duration: 0.6, ease: "power3.in" }, 6.2);
    tl.to("#tt-sun", { scale: 0.4, opacity: 0, duration: 0.5, ease: "power3.in", transformOrigin: "50% 50%" }, 6.2);
    tl.to("#tt-iris", { clipPath: "circle(1400px at 540px 1060px)", duration: 0.5, ease: "power2.in" }, 6.45);

    window.__timelines["tete"] = tl;
  </script>
