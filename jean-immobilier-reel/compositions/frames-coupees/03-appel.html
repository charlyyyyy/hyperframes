    var g = opt.box && i === opt.box[0] ? ["box", opt.box[1]] : opt.stroke && i === opt.stroke[0] ? ["stroke", opt.stroke[1]] : null;

    '<div id="p03-banner"><svg viewBox="0 0 40 36"><circle cx="10" cy="18" r="7.5" fill="none" stroke="#26313A" stroke-width="3.4"/>' +
      '<circle cx="30" cy="18" r="7.5" fill="none" stroke="#26313A" stroke-width="3.4"/><line x1="10" y1="25.5" x2="30" y2="25.5" stroke="#26313A" stroke-width="3.4"/></svg>' +
      "<span>Messagerie pleine</span></div>" +
    '<div id="p03-off"><div id="p03-glare"></div></div>' +
  "</div>";

var world = q("#p03-world"), lens = q("#p03-lens");
world.innerHTML =
  '<div class="ji-dots"></div>' +
  '<div class="ji-ribbon" style="left:2600px;top:-70px;width:4400px"></div>' +
  jiTileHTML("p03-tile", "LUNDI", "20", "").replace('class="ji-tile"', 'class="ji-tile" style="left:4520px;top:-350px"') +
  '<div class="ji-a" style="left:4620px;top:-370px">' + jiPhoneHTML("p03-phone", callHTML, true) + "</div>";
var pill = q("#p03-pill");
pill.style.position = "relative"; pill.style.opacity = "0";

/* ---------- calque interface (espace écran) : curseur + ondes du tap ---------- */
var ui = q("#p03-ui");
ui.innerHTML = '<div id="p03-rip1" class="ji-ripple"></div><div id="p03-rip2" class="ji-ripple"></div>' + jiCursorSVG("p03-cur");

/* ---------- sous-titres ---------- */
var sub1 = q("#p03-sub1"), sub2 = q("#p03-sub2");
sub1.innerHTML = jiSubHTML("p03a", ["Vous", "appelez", "…"], { box: [1, 1] })
  .replace('</span></span> <span class="ji-w p03a-w">…', '</span></span><span class="ji-w p03a-w">…');
sub2.innerHTML = jiSubHTML("p03b", ["Messagerie", "pleine."], { stroke: [1, 1] });

/* ---------- caméra ----------
   jiCam pose le monde sur LUNDI (4800, 0) à l'échelle 1 ; l'échelle est portée par #p03-zoom (scale autour de (540, 960)),
   le panoramique vertical par #p03-pan (y = -cam.y) : jiCam(world, {x: 4800, y: cam.y, s: cam.s}) sans onUpdate (seek sûr).
   Vertical : l'écran d'appel remplit la largeur du cadre (×2,85 → ×3,14), le contenu de l'écran tient entre y 250 et 1240. */
jiCam(world, { x: 4800, y: 0, s: 1, r: 0 });
var zoom = q("#p03-zoom"), pan = q("#p03-pan");
var tl = gsap.timeline({ paused: true });
window.__timelines = window.__timelines || {};

var BTN_WY = -356 + 408; /* centre du bouton en y monde (écran : haut à -356) */
function S(t, d, a, b, ease) { tl.fromTo(zoom, { scale: a }, { scale: b, duration: d, ease: ease || "none", immediateRender: false }, t); }
function Y(t, d, a, b, ease) { tl.fromTo(pan, { y: -a }, { y: -b, duration: d, ease: ease || "none", immediateRender: false }, t); }
function B(t, d, a, b, ease) { tl.fromTo(lens, { filter: "blur(" + a + "px)" }, { filter: "blur(" + b + "px)", duration: d, ease: ease || "none", immediateRender: false }, t); }
gsap.set(zoom, { scale: 1.6 }); gsap.set(pan, { y: 0 }); gsap.set(lens, { filter: "blur(8px)" });
/* P6 : la plongée se pose (relais ×1,6 à +200 %/s), puis dérive +2 %/s */
var S0 = 1.6, S1 = 2.85, D0 = 1.15;
S(0, D0, S0, S1, "power3.out");
B(0, 0.25, 8, 0, "power2.out");
S(D0, 1.27 - D0, S1, 2.857);
/* P7 : poussée lente linéaire ×1,0 → ×1,08 */
S(1.27, 2.2, 2.857, 3.086);
/* P8 : dérive, petit coup au contact de la bannière (+8 px écran), puis plongée dans l'écran éteint et recul */
S(3.47, 1.29, 3.086, 3.13);
Y(3.79, 0.08, 0, -8 / 3.1, "power2.out");
Y(3.87, 0.16, -8 / 3.1, 0, "power2.inOut");
S(4.76, 0.12, 3.13, 7.2, "expo.inOut");
B(4.76, 0.06, 0, 10, "power2.in"); B(4.82, 0.06, 10, 6, "power2.out");
S(4.88, 0.17, 7.2, 6.47); /* recul −60 %/s, flou 6 px tenu */

/* position écran du bouton à l'instant t (même courbe que la caméra) */
var p3o = gsap.parseEase("power3.out");
function camS(t) {
  if (t <= D0) return S0 + (S1 - S0) * p3o(t / D0);
  if (t <= 1.27) return S1 + 0.007 * (t - D0) / (1.27 - D0);
  if (t <= 3.47) return 2.857 + 0.229 * (t - 1.27) / 2.2;
  return 3.086 + 0.044 * Math.min(1, (t - 3.47) / 1.29);
}
function btnScreenY(t) { return 960 + camS(t) * BTN_WY; }

/* ---------- P6 (0.00 → 1.27) : le tap vert ---------- */
var cur = q("#p03-cur"), rip1 = q("#p03-rip1"), rip2 = q("#p03-rip2");
var TX = 540, TY1 = btnScreenY(0.46), TY2 = btnScreenY(4.76);
rip1.style.left = TX + "px"; rip1.style.top = TY1.toFixed(1) + "px";
rip2.style.left = TX + "px"; rip2.style.top = TY2.toFixed(1) + "px";
/* une seule courbe depuis le bas : x et y sur deux courbes différentes, clic direct */
tl.fromTo(cur, { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, 0.1);
tl.fromTo(cur, { x: TX - 6 + 300 }, { x: TX - 6, duration: 0.33, ease: "power2.out", immediateRender: false }, 0.1);
tl.fromTo(cur, { y: 1980 }, { y: TY1 - 4, duration: 0.33, ease: "power3.out", immediateRender: false }, 0.1);
tl.fromTo(cur, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.in", immediateRender: false }, 0.46);
tl.fromTo(cur, { scale: 0.85 }, { scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 0.52);
tl.fromTo("#p03-btn-call", { scale: 1 }, { scale: 0.94, duration: 0.06, ease: "power2.in", immediateRender: false }, 0.46);
tl.fromTo("#p03-btn-call", { scale: 0.94 }, { scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 0.52);
tl.fromTo(rip1, { scale: 0.35, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 0.46);
/* le curseur repart vers le bas, plus vite qu'il n'est venu */
tl.fromTo(cur, { x: TX - 6, y: TY1 - 4, opacity: 1 }, { x: TX + 30, y: TY1 + 36, opacity: 0, duration: 0.16, ease: "power3.in", immediateRender: false }, 0.72);
/* 0.61 l'appel part : bouton vert → raccrocher, « Appel en cours… » et chrono */
tl.fromTo("#p03-btn-call", { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, 0.6);
tl.fromTo("#p03-btn-end", { opacity: 0, rotation: -60 }, { opacity: 1, rotation: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 0.6);
tl.fromTo("#p03-status", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 0.59);

/* chrono à rouleaux : 00:00 (0.61) → 00:04 (1.27) → 00:12 (2.76) → 00:18 (3.47) → 00:21 figé (3.96) */
var KEYS = [[0.61, 0], [1.27, 4], [2.76, 12], [3.47, 18], [3.96, 21]];
function tickTime(k) {
  for (var i = 1; i < KEYS.length; i++) {
    var a = KEYS[i - 1], b = KEYS[i];
    if (k <= b[1]) return a[0] + (b[0] - a[0]) * (k - a[1]) / (b[1] - a[1]);
  }
  return KEYS[KEYS.length - 1][0];
}
var ones = q("#p03-ones"), tens = q("#p03-tens"), ST1 = 100 / 11, ST10 = 100 / 3;
for (var k = 1; k <= 21; k++) {
  var tk = tickTime(k), prev = (k - 1) % 10, nxt = k % 10 === 0 ? 10 : k % 10;
  tl.fromTo(ones, { yPercent: -ST1 * prev }, { yPercent: -ST1 * nxt, duration: 0.08, ease: "power2.out", immediateRender: false }, tk - 0.08);
  if (k % 10 === 0) tl.fromTo(tens, { yPercent: -ST10 * (k / 10 - 1) }, { yPercent: -ST10 * (k / 10), duration: 0.08, ease: "power2.out", immediateRender: false }, tk - 0.08);
}

/* sous-titre 1 : « Vous appelez… », boîte sur appelez ; sort avant P7 (sans texte) */
jiSubAnim(tl, sub1, [0.27, 0.59, 0.66], { boxAt: 0.56, outAt: 1.13 });

/* ---------- P7 (1.27 → 3.47) : deux sonneries dans le vide ---------- */
jiPillBorn(tl, pill, 1.46);
jiPillPulse(tl, pill, 1.62, 3);
function ringAt(t, a, b) {
  tl.fromTo(a, { scale: 1, opacity: 0.9 }, { scale: 2.5, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, t);
  tl.fromTo(b, { scale: 1, opacity: 0.7 }, { scale: 2.5, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, t + 0.12);
  tl.fromTo("#p03-av", { scale: 1 }, { scale: 1.07, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
  tl.fromTo("#p03-av", { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, t + 0.1);
}
ringAt(1.5, "#p03-ring1", "#p03-ring2");
ringAt(2.7, "#p03-ring3", "#p03-ring4");
/* bord du téléphone flou en avant-plan (parallaxe, côté droit), le temps des sonneries */
tl.fromTo("#p03-fg", { opacity: 0, x: 0 }, { opacity: 0.8, duration: 0.5, ease: "power2.out", immediateRender: false }, 1.27);
tl.fromTo("#p03-fg", { x: 0 }, { x: -120, duration: 2.2, ease: "none", immediateRender: false }, 1.27);
tl.fromTo("#p03-fg", { opacity: 0.8 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 3.36);

/* ---------- P8 (3.47 → 5.05) : « Messagerie pleine. » ---------- */
tl.fromTo("#p03-banner", { opacity: 1, y: -300, rotation: -1.5 }, { opacity: 1, y: 0, rotation: -1.5, duration: 0.13, ease: "power2.in", immediateRender: false }, 3.66);
tl.fromTo("#p03-banner", { y: 0 }, { y: -4.5, duration: 0.08, ease: "power2.out", immediateRender: false }, 3.79);
tl.fromTo("#p03-banner", { y: -4.5 }, { y: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, 3.87);
/* 3.96 le chrono s'arrête (00:21) et s'éteint d'un ton */
tl.fromTo("#p03-clock", { opacity: 1 }, { opacity: 0.5, duration: 0.2, ease: "power2.out", immediateRender: false }, 3.97);
/* 4.56 sur « pleine », l'agence grise */
tl.fromTo("#p03-av", { opacity: 1, filter: "saturate(1) brightness(1)" }, { opacity: 0.45, filter: "saturate(0) brightness(0.75)", duration: 0.25, ease: "power2.out", immediateRender: false }, 4.56);
tl.fromTo("#p03-name", { opacity: 1 }, { opacity: 0.45, duration: 0.25, ease: "power2.out", immediateRender: false }, 4.56);
/* 4.76 tap rouge : une seule courbe depuis le bas, clic direct */
tl.fromTo(cur, { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, 4.42);
tl.fromTo(cur, { x: TX - 6 - 260 }, { x: TX - 6, duration: 0.32, ease: "power2.out", immediateRender: false }, 4.42);
tl.fromTo(cur, { y: 1980 }, { y: TY2 - 4, duration: 0.32, ease: "power3.out", immediateRender: false }, 4.42);
tl.fromTo(cur, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.in", immediateRender: false }, 4.76);
tl.fromTo("#p03-btn-end", { scale: 1 }, { scale: 0.94, duration: 0.06, ease: "power2.in", immediateRender: false }, 4.76);
tl.fromTo(rip2, { scale: 0.35, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, 4.76);
tl.fromTo(cur, { x: TX - 6, y: TY2 - 4, opacity: 1, scale: 0.85 }, { x: TX - 26, y: TY2 + 26, opacity: 0, scale: 0.85, duration: 0.1, ease: "power3.in", immediateRender: false }, 4.8);
/* l'écran s'éteint (0,1 s) : nuit ardoise et reflet léger */
tl.fromTo("#p03-off", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, 4.77);
/* sous-titre 2 : « Messagerie pleine. », trait sous pleine ; sort avant la couture */
jiSubAnim(tl, sub2, [3.75, 4.55], { strokeAt: 4.55, outAt: 4.82 });

/* tient la durée exacte */
tl.set({}, {}, 5.05);
window.__timelines["03-appel"] = tl;
})();
</script>
</div>
</template>
