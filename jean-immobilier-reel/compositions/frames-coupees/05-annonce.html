    '<rect x="52" y="270" width="206" height="34" rx="14" fill="#5E6E74"/>' +
    '<rect x="60" y="342" width="10" height="20" fill="#1A2226"/><rect x="240" y="342" width="10" height="20" fill="#1A2226"/>' +
    '<rect x="370" y="324" width="120" height="14" rx="4" fill="#3A474C"/>' +
    '</svg>';

  /* --- la carte ANNONCE, haute : 940 × 850, centre monde (3700, 2500) --- */
  var CW = 940, CH = 850;
  var targets = [3, 8, 4, 1, 8, 5];
  var rollX = [], rollHTML = "";
  for (var i = 0; i < 6; i++) rollX.push(44 + i * 108 + (i >= 3 ? 24 : 0));
  var rollers = [];
  for (i = 0; i < 6; i++) {
    var nSpin = 10 + ((i * 5) % 4);
    var items = ["—"];
    for (var k = 0; k < nSpin; k++) items.push(String((targets[i] + 3 + k * 7 + i * 2) % 10));
    items.push(String(targets[i]));
    if (i === 1) items.push("7"); /* barré-corrigé : 384 185 → 374 185 */
    var h = "";
    for (k = 0; k < items.length; k++) h += '<div class="p05-it">' + items[k] + "</div>";
    rollHTML += '<div class="ji-num p05-roll" style="left:' + rollX[i] + 'px"><div id="p05-st' + i + '" class="p05-stack" style="filter:url(#p05-vb' + i + ')">' + h + "</div></div>";
    rollers.push({ n: nSpin, springs: [], el: null, g: null, blur: null });
  }
  var eurX = rollX[5] + 96 + 22;
  var units = "", tens = '<div class="p05-mi"></div>';
  for (k = 0; k < 100; k++) units += '<div class="p05-mi">' + (k % 10) + "</div>";
  for (k = 1; k < 10; k++) tens += '<div class="p05-mi">' + k + "</div>";

  var annonce =
    '<div id="p05-card" class="ji-card dark p05-card" style="left:' + (3700 - CW / 2) + "px;top:" + (2500 - CH / 2) + 'px">' +
    '<div class="p05-photo">' + photo + '<div id="p05-shade"></div></div>' +
    '<div id="p05-price">' +
    '<div class="ji-lb p05-lbl">Prix</div>' +
    '<div id="p05-minus">−10 000 €</div>' +
    rollHTML +
    '<div class="p05-eur" style="left:' + eurX + 'px">€</div>' +
    '<div id="p05-strike"></div>' +
    "</div>" +
    '<div id="p05-online"><div class="ji-lb">En ligne depuis</div>' +
    '<div class="p05-mini" style="left:0"><div id="p05-tens" class="p05-stack">' + tens + "</div></div>" +
    '<div class="p05-mini" style="left:33px"><div id="p05-units" class="p05-stack">' + units + "</div></div>" +
    '<div id="p05-jours">jours</div></div>' +
    '<div id="p05-pillw">' + jiPillHTML("p05-pill", "En attente") + "</div>" +
    "</div>";

  /* --- le bien (4800, 2600), LOYER (5900, 2500), TRAVAUX (4800, 3500) --- */
  var bien = '<div class="ji-a" style="left:4600px;top:2390px">' + jiBuildingSVG("p05-bien", 400, JI.ink, true) + "</div>";
  function sideCard(id, x, y, label) {
    return '<div id="' + id + '" class="ji-card dark p05-card p05-side" style="left:' + (x - CW / 2) + "px;top:" + (y - CH / 2) + 'px">' +
      '<div class="ji-lb">' + label + '</div><div class="p05-pw">' + jiPillHTML(id + "-pill", "En attente") + "</div></div>";
  }
  world.insertAdjacentHTML("beforeend", bien + annonce + sideCard("p05-loyer", 5900, 2500, "Loyer") + sideCard("p05-travaux", 4800, 3500, "Travaux"));

  for (i = 0; i < 6; i++) {
    rollers[i].el = document.getElementById("p05-st" + i);
    rollers[i].g = document.getElementById("p05-vg" + i);
  }
  var tensEl = document.getElementById("p05-tens"), unitsEl = document.getElementById("p05-units");

  /* objets d'état à setters : chaque écriture GSAP (même en seek à événements muets) réapplique le rendu */
  function live(init, fn) {
    var o = {};
    Object.keys(init).forEach(function (key) {
      var v = init[key];
      Object.defineProperty(o, key, { enumerable: true, get: function () { return v; }, set: function (n) { v = n; fn(); } });
    });
    return o;
  }
  function applyRoller(a) {
    var R = rollers[a], sum = 0;
    for (var b = 0; b < R.springs.length; b++) sum += R.springs[b].p;
    R.el.style.transform = "translateY(" + (-sum * 130).toFixed(2) + "px)";
    R.g.setAttribute("stdDeviation", "0 " + R.blur.v.toFixed(2));
  }
  for (i = 0; i < 6; i++) rollers[i].blur = live({ v: 0 }, applyRoller.bind(null, i));

  /* --- sous-titres --- */
  var sub1 = document.getElementById("p05-sub1"), sub2 = document.getElementById("p05-sub2");
  sub1.innerHTML = jiSubHTML("p05a", ["Un", "prix", "fixé", "au", "hasard"], { box: [3, 4] }) + '<span class="ji-w p05a-w">…</span>';
  sub2.innerHTML = jiSubHTML("p05b", ["et", "une", "annonce", "qui", "dort."], { stroke: [4, 4] });

  /* --- état : caméra, flou, rouleaux, compteur --- */
  var cam, lensB, cnt;
  function applyCam() { if (cam) jiCam(world, cam); }
  function applyLens() { if (lensB) jiBlur(lens, lensB.b); }
  function applyCount() {
    if (!cnt) return;
    var v = cnt.v, fl = Math.floor(v), fr = v - fl;
    unitsEl.style.transform = "translateY(" + (-v * 64).toFixed(2) + "px)";
    var tp = Math.floor(fl / 10) + ((fl % 10) === 9 ? fr : 0);
    tensEl.style.transform = "translateY(" + (-tp * 64).toFixed(2) + "px)";
  }
  cam = live({ x: 4100, y: 2550, s: 0.8, r: 0 }, applyCam);
  lensB = live({ b: 10 }, applyLens);
  cnt = live({ v: 1 }, applyCount);
  function applyAll() {
    applyCam(); applyLens(); applyCount();
    for (var a = 0; a < 6; a++) applyRoller(a);
  }

  var tl = gsap.timeline({ paused: true, onUpdate: applyAll });

  /* PISTE CAMÉRA : cran 0.00 à 0.14, dérive x +15 u/s, cran → LOYER à 2.99.
     Vertical : la carte (850 de haut) est posée dans le tiers haut (centre écran y ≈ 755) → caméra y = 2500 + 205. */
  var LAND_X = 3660, LAND_Y = 2705, DRIFT_END = LAND_X + 15 * (2.99 - 0.14);
  tl.fromTo(cam, { x: 4100, y: 2550, s: 0.8 }, { x: LAND_X, y: LAND_Y, s: 1, duration: 0.14, ease: "expo.out", onUpdate: applyAll }, 0);
  tl.fromTo(lensB, { b: 10 }, { b: 0, duration: 0.14, ease: "expo.out", onUpdate: applyAll }, 0);
  tl.fromTo(cam, { x: LAND_X }, { x: DRIFT_END, duration: 2.99 - 0.14, ease: "none", immediateRender: false, onUpdate: applyAll }, 0.14);
  tl.fromTo(cam, { x: DRIFT_END, y: LAND_Y, s: 1 }, { x: 5300, y: 2550, s: 0.8, duration: DUR - 2.99, ease: "power2.in", immediateRender: false, onUpdate: applyAll }, 2.99);
  tl.fromTo(lensB, { b: 0 }, { b: 10, duration: DUR - 2.99, ease: "power2.in", immediateRender: false, onUpdate: applyAll }, 2.99);

  /* Scene 11 : les rouleaux roulent (0.39, 0,7 s) puis s'arrêtent net sur « hasard » (1.10), chacun à sa valeur */
  for (i = 0; i < 6; i++) {
    var R = rollers[i];
    var spinStart = 0.39 + i * 0.02, finalStart = 0.99 + i * 0.012;
    var sp = (finalStart - spinStart) / R.n;
    for (k = 0; k < R.n; k++) {
      var s1 = live({ p: 0 }, applyRoller.bind(null, i)); R.springs.push(s1);
      tl.to(s1, { p: 1, duration: 0.13, ease: "back.out(1.3)", onUpdate: applyAll }, spinStart + k * sp);
    }
    var sF = live({ p: 0 }, applyRoller.bind(null, i)); R.springs.push(sF);
    tl.to(sF, { p: 1, duration: 0.17, ease: "back.out(2.4)", onUpdate: applyAll }, finalStart);
    tl.fromTo(R.blur, { v: 0 }, { v: 9, duration: 0.14, ease: "power2.out", immediateRender: false, onUpdate: applyAll }, spinStart);
    tl.to(R.blur, { v: 0, duration: 0.09, ease: "power2.out", onUpdate: applyAll }, finalStart);
  }
  /* barré-corrigé une fois (−10 000 €) */
  tl.fromTo("#p05-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.27);
  tl.fromTo("#p05-minus", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 1.39);
  var sC = live({ p: 0 }, applyRoller.bind(null, 1)); rollers[1].springs.push(sC);
  tl.to(sC, { p: 1, duration: 0.26, ease: "back.out(1.8)", onUpdate: applyAll }, 1.42);
  tl.to("#p05-strike", { opacity: 0, duration: 0.12, ease: "power1.in" }, 1.5);

  /* Scene 12 : « En ligne depuis » + 1 → 94 jours (1.89, 0,5 s) ; pastille 2.39 ; « dort » 2.77 */
  tl.fromTo("#p05-online", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 1.86);
  tl.fromTo(cnt, { v: 1 }, { v: 94, duration: 0.5, ease: "power2.out", immediateRender: false, onUpdate: applyAll }, 1.89);
  var pill = document.getElementById("p05-pill");
  jiPillBorn(tl, pill, 2.39);
  jiPillPulse(tl, pill, 2.5, 1);
  tl.fromTo("#p05-shade", { opacity: 0 }, { opacity: 0.74, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.77);
  tl.fromTo("#p05-price", { opacity: 1 }, { opacity: 0.55, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.77);
  tl.fromTo("#p05-card", { rotation: 0 }, { rotation: -2, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.77);

  /* sous-titres mot par mot */
  jiSubAnim(tl, sub1, [0.22, 0.38, 0.54, 0.9, 1.1, 1.1], { boxAt: 0.87, outAt: 1.55 });
  jiSubAnim(tl, sub2, [1.86, 2.06, 2.14, 2.58, 2.77], { strokeAt: 2.74, outAt: 2.88 });

  tl.set({}, {}, DUR);
  applyAll();
  window.__timelines = window.__timelines || {};
  window.__timelines[FID] = tl;
})();
</script>
</div>
</template>
