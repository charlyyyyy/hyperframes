    '<rect x="24" y="186" width="92" height="74" rx="6"/><rect x="246" y="186" width="92" height="74" rx="6"/><rect x="146" y="186" width="70" height="74" rx="6"/></g>' +
    '<g fill="none" stroke="#FFFFFF" stroke-linecap="round"><path d="M0 140 H360" stroke-width="22"/><path d="M131 0 V280" stroke-width="14"/><path d="M231 0 V280" stroke-width="14"/><path d="M0 92 L360 60" stroke-width="8"/></g>' +
    '<g fill="none" stroke="#DADAD6" stroke-width="2"><path d="M0 129 H360 M0 151 H360"/></g>' +
    '<path d="M180 140 C180 140 160 112 160 96 A20 20 0 1 1 200 96 C200 112 180 140 180 140 Z" fill="' + RED + '"/><circle cx="180" cy="96" r="7.5" fill="#FFFFFF"/></svg></div></div>';
  /* the four métier tiles, 2 x 2 */
  h += '<div id="p10-grid" class="ji-a" style="left:0;top:' + CY.toFixed(2) + 'px;transform:scale(' + K.toFixed(5) + ')">';
  for (var i = 0; i < 4; i++) {
    h += '<div id="p10-slot' + i + '" class="p10-slot" style="left:' + SLOT_X[i] + 'px;top:' + SLOT_Y[i] + 'px">' +
      '<div id="p10-tile' + i + '" class="ji-card light p10-tile"><div class="p10-well"><div class="p10-pic">' +
      '<div class="p10-ink" id="p10-ink' + i + '">' + picHTML(i, INK, "ink") + "</div>" +
      '<div class="p10-red" id="p10-red' + i + '">' + picHTML(i, RED, "red") + "</div>" +
      '</div></div><div class="p10-name">' + NAMES[i] + "</div></div></div>";
  }
  h += "</div>";
  world.innerHTML = h;

  /* ---------- subtitle ---------- */
  var sub1 = $("p10-sub1"), sub2 = $("p10-sub2");
  sub1.innerHTML = jiSubHTML("p10a", ["pour", "vendre,", "louer,", "gérer", "votre", "bien,"], { box: [3, 3] });
  sub2.innerHTML = jiSubHTML("p10b", ["et", "administrer", "votre", "immeuble."], { box: [1, 1] });

  /* ---------- camera ---------- */
  /* state objects with setters: every GSAP render (even a seek with suppressed events) re-applies the camera */
  var st = { x: 0, y: 0, s: 1, d: 0, b: 4 };
  function apply() {
    jiCam(world, { x: st.x + st.d, y: st.y, s: st.s, r: 0 });
    jiBlur(lens, st.b);
  }
  function live(map) {
    var o = {};
    Object.keys(map).forEach(function (k) {
      Object.defineProperty(o, k, { enumerable: true, get: function () { return st[map[k]]; }, set: function (v) { st[map[k]] = v; apply(); } });
    });
    return o;
  }
  var cam = live({ x: "x", y: "y", s: "s" }), drift = live({ x: "d" }), lb = live({ b: "b" });
  apply();

  var tl = gsap.timeline({ paused: true, onUpdate: apply });
  var IR = { immediateRender: false };
  function ft(o, a, b2, at) { tl.fromTo(o, a, Object.assign({}, b2, IR), at); }
  /* recul 0.00 to 0.30 (continues the pull-back of frame 9) */
  ft(cam, { s: 1, y: 0, x: 0 }, { s: S_HOLD, y: CY, x: X0, duration: 0.30, ease: "power2.out" }, 0);
  ft(lb, { b: 4 }, { b: 0, duration: 0.15, ease: "power2.out" }, 0);
  /* permanent linear drift */
  tl.fromTo(drift, { x: 0 }, { x: DRIFT, duration: 3.40, ease: "none", immediateRender: false }, 0.30);
  /* light lateral notch on each tile (always the same direction : no back-and-forth) */
  var NOTCH_T = [0.35, 0.85, 1.50, 2.55];
  var prevX = X0;
  for (var n = 0; n < 4; n++) {
    var tx = X0 + STEP * (n + 1);
    ft(cam, { x: prevX }, { x: tx, duration: 0.14, ease: "expo.inOut" }, NOTCH_T[n]);
    ft(lb, { b: 0 }, { b: 6, duration: 0.07, ease: "power2.in" }, NOTCH_T[n]);
    ft(lb, { b: 6 }, { b: 0, duration: 0.07, ease: "power2.out" }, NOTCH_T[n] + 0.07);
    prevX = tx;
  }

  /* ---------- 0.05 : team + map leave upward, the four tiles arrive from below ---------- */
  tl.fromTo("#p10-team", { y: 0, opacity: 1, filter: "blur(0px)" }, { y: -1100, opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in", immediateRender: false }, 0.05);
  tl.fromTo("#p10-map", { y: 0, opacity: 1, filter: "blur(0px)" }, { y: -1100, opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in", immediateRender: false }, 0.07);
  for (var k = 0; k < 4; k++) {
    tl.fromTo("#p10-slot" + k, { y: 360, scale: 1.1, opacity: 0, filter: "blur(12px)" },
      { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.30, ease: "power3.out", immediateRender: false }, 0.05 + k * 0.04);
  }

  /* ---------- each tile lifts on its verb, its pictogram turns red ---------- */
  function lift(i, t) {
    tl.fromTo("#p10-tile" + i, { y: 0 }, { y: -40, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
    tl.fromTo("#p10-red" + i, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
    tl.fromTo("#p10-ink" + i, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
  }
  function drop(i, t) {
    tl.fromTo("#p10-tile" + i, { y: -40 }, { y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
    tl.fromTo("#p10-red" + i, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
    tl.fromTo("#p10-ink" + i, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
  }
  lift(0, 0.30);
  drop(0, 0.80); lift(1, 0.80);
  drop(1, 1.45); lift(2, 1.45);
  drop(2, 2.50); lift(3, 2.50);

  /* ---------- 3.65 : VENTE detaches and flies to the PRIX card (world 3700, 2500) ---------- */
  var gx = 3700 * S_HOLD, gy = (2500 - CY) * S_HOLD;
  var dx = gx - (SLOT_X[0] + TS / 2), dy = gy - (SLOT_Y[0] + TS / 2);
  tl.fromTo("#p10-tile0", { y: 0, scale: 1 }, { y: -50, scale: 1.04, duration: 0.1, ease: "power3.out", immediateRender: false }, 3.62);
  tl.fromTo("#p10-tile0", { y: -50, scale: 1.04 }, { y: 0, scale: 1, duration: 0.22, ease: "expo.inOut", immediateRender: false }, 3.70);
  tl.fromTo("#p10-slot0", { x: 0, y: 0 }, { x: dx, y: dy, duration: 0.22, ease: "expo.inOut", immediateRender: false }, 3.70);
  /* the notch toward PRIX : arrives at cam(4100, 2550, 0.80) with the lens at 10 px */
  ft(cam, { x: prevX, y: CY, s: S_HOLD }, { x: 4100 - DRIFT, y: 2550, s: 0.80, duration: 0.22, ease: "expo.inOut" }, 3.70);
  ft(lb, { b: 0 }, { b: 10, duration: 0.15, ease: "power2.in" }, 3.70);

  /* ---------- subtitle, word by word ---------- */
  jiSubAnim(tl, sub1, [0.13, 0.37, 0.89, 1.53, 1.81, 2.13], { boxAt: 1.49, outAt: 2.21 });
  jiSubAnim(tl, sub2, [2.41, 2.57, 3.17, 3.41], { boxAt: 2.53, outAt: 3.68 });

  tl.set({}, {}, D);
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
</div>
