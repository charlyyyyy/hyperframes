body{width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;background:#000}

.black{background:#07090F}
.a{position:absolute}

/* subtitle */
.sub{position:absolute;left:0;right:0;top:900px;text-align:center;font-size:62px;font-weight:600;letter-spacing:-.01em;z-index:50}
.dark .sub,.black .sub{color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.55)}
.light .sub{color:var(--inkd);text-shadow:0 2px 12px rgba(245,242,236,.9)}
.sub .bx{background:var(--acc);color:#fff;padding:0 .18em;border-radius:10px;text-shadow:none}
.sub .tr{position:relative}
.sub .tr::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-6px;height:7px;border-radius:7px;background:linear-gradient(90deg,transparent,var(--acc) 12%,var(--acc) 70%,transparent)}
.sub .dim{opacity:.0}
.typo{position:absolute;left:0;right:0;text-align:center;font-size:84px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
/* tiles */
.tile{position:absolute;width:560px;height:700px;border-radius:36px;background:linear-gradient(180deg,var(--tile2),var(--tile));box-shadow:0 40px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);color:var(--ink)}
.tile .hd{position:absolute;left:44px;top:36px;font-size:44px;font-weight:800;letter-spacing:.04em}
.tile .hd small{font-weight:500;color:var(--mute);margin-left:10px}
.tile .hr{position:absolute;right:44px;top:44px;font:600 30px Inter;color:var(--mute)}
.ribbon{position:absolute;height:6px;border-radius:3px;background:rgba(238,241,246,.14)}
/* phone */
.phone{position:absolute;width:360px;height:740px;border-radius:58px;background:#0A0D14;padding:14px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 2px #2A3245}
.phone .scr{width:100%;height:100%;border-radius:46px;background:#F4F5F8;overflow:hidden;position:relative;color:#111}
.phone .isl{position:absolute;left:50%;top:14px;width:110px;height:32px;margin-left:-55px;border-radius:20px;background:#000;z-index:3}
.scr.dk{background:linear-gradient(180deg,#2B3550,#121827);color:#fff}
/* pills */
.pill{position:absolute;display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:40px;font:700 26px Inter;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.pill.w{background:var(--amber);color:#2B1A00}
.pill.ok{background:var(--acc);color:#fff}
.dots{display:inline-flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#2B1A00;opacity:.85}.dots i:nth-child(2){opacity:.5}.dots i:nth-child(3){opacity:.25}
/* cards */
.card{position:absolute;border-radius:28px;padding:34px;font-family:Inter}
.dark .card{background:linear-gradient(180deg,#22304F,#1A2540);color:var(--ink);box-shadow:0 40px 80px rgba(0,0,0,.5)}
.light .card{background:#fff;color:var(--inkd);box-shadow:0 30px 70px rgba(24,32,46,.14)}
.card .lb{font:700 22px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.card .big{font:800 64px Inter;letter-spacing:-.02em;margin-top:10px}
.card .ln{font:500 28px Inter;opacity:.85;margin-top:10px}
.blur4{filter:blur(4px)}.blur8{filter:blur(8px)}.blur12{filter:blur(12px)}.blur18{filter:blur(18px)}
.note{position:absolute;right:28px;top:22px;font:600 20px Inter;padding:6px 14px;border-radius:8px;background:rgba(242,169,59,.9);color:#2B1A00;z-index:60}
.cursor{position:absolute;width:0;height:0;z-index:40}
</style></head>
