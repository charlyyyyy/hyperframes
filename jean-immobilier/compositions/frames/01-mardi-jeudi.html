/* caméra : amène le point (x, y) du monde au centre du cadre, à l'échelle s, rotation r (degrés) */
function jiCam(worldEl, c) {
  var s = c.s, r = c.r || 0;
  worldEl.style.transform = "translate(960px,540px) rotate(" + r.toFixed(3) + "deg) scale(" + s.toFixed(4) + ") translate(" + (-c.x).toFixed(2) + "px," + (-c.y).toFixed(2) + "px)";
}
function jiBlur(el, px) { el.style.filter = px > 0.25 ? "blur(" + px.toFixed(1) + "px)" : "none"; }
/* sous-titre : words = ["Mardi,"] ; box = [i, j] indices (inclus) des mots dans la boîte ; stroke = [i, j] sous le trait */
function jiSubHTML(p, words, opt) {
  opt = opt || {}; var h = "", i = 0;
  function span(k) { return '<span class="ji-w ' + p + '-w">' + words[k] + "</span>"; }
  while (i < words.length) {
    var g = opt.box && i === opt.box[0] ? ["box", opt.box[1]] : opt.stroke && i === opt.stroke[0] ? ["stroke", opt.stroke[1]] : null;
    if (g) {
      var inner = []; for (var k = i; k <= g[1]; k++) inner.push(span(k));
      h += '<span class="ji-kw">' + (g[0] === "box" ? '<i class="ji-box ' + p + '-box"></i>' : "") + inner.join(" ") +
        (g[0] === "stroke" ? '<i class="ji-stroke ' + p + '-stroke"></i>' : "") + "</span>";
      i = g[1] + 1;
    } else { h += span(i); i++; }
    if (i < words.length) h += " ";

}
/* anime le sous-titre : cues (temps locaux) par mot ; boxAt / strokeAt optionnels ; outAt = sortie (0,14 s) */
function jiSubAnim(tl, subEl, cues, o) {
  o = o || {};
  var ws = subEl.querySelectorAll(".ji-w");
  for (var i = 0; i < ws.length; i++) {
    tl.fromTo(ws[i], { opacity: 0, y: 8, filter: "blur(6px)" },

          '<div id="p01-phonewrap" class="ji-a">' + jiPhoneHTML("p01-phone", notif, false) + "</div>" +
          '<div id="p01-pillw1" class="ji-a">' + jiPillHTML("p01-pill1", "En attente") + "</div>" +
          '<div id="p01-jeudi" class="ji-a">' + jiTileHTML("p01-tile-jeudi", "JEUDI", "16", "") + cardHTML +
          '<div id="p01-pillw2" class="ji-a">' + jiPillHTML("p01-pill2", "En attente") + "</div></div>";
        $("p01-tile-mardi").insertAdjacentHTML("beforeend", clockSVG);
        var hr = $("p01-tile-mardi").querySelector(".ji-tile-hr");

        /* couche lointaine : tuiles vides, floues, dans le flou du fond */
        var bx = [900, 2200, 3300], bh = "";
        for (var b = 0; b < bx.length; b++) bh += '<div class="ji-a p01-back" style="left:' + (bx[b] - 280) + 'px;top:-350px">' + jiTileHTML("p01-back" + b, "", "", "") + "</div>";
        back.innerHTML = bh;
        /* premier plan : bord d'une tuile vide, flou, coupé à gauche */
        fg.innerHTML = '<div id="p01-fg" class="ji-a" style="left:-1080px;top:-350px">' + jiTileHTML("p01-fgtile", "", "", "") + "</div>";

        /* ---------- sous-titres ---------- */
        var sub1 = $("p01-sub1"), sub2 = $("p01-sub2"), sub3 = $("p01-sub3");
        sub1.innerHTML = jiSubHTML("p01", ["Mardi"], { box: [0, 0] }) + '<span class="ji-w p01-w">,</span>';
        sub2.innerHTML = jiSubHTML("p01", ["vous", "attendez", "le", "rappel", "de", "l’agence."], { box: [2, 3] });
        sub3.innerHTML = jiSubHTML("p01", ["Jeudi,", "vous", "attendez", "le", "loyer"], { box: [3, 4] }) + '<span class="ji-w p01-w">.</span>';

        /* ---------- caméra : une seule source, camAt(t), appliquée par jiCam ---------- */
        var EIO = gsap.parseEase("expo.inOut");
        function lerp(a, b, e) { return a + (b - a) * e; }
        var A = { x: 20 * 0.66, y: 0, s: 1 + 0.02 * 0.66 };   // fin de la dérive de P1
        var B = { x: 96, y: 60, s: 1.25 };                    // cran sur le téléphone
        var C = { x: 96, y: 60 - 10 * (2.42 - 0.78), s: 1.25 }; // fin de la dérive de P2
        var D = { x: 2400, y: 0, s: 1.0 };                    // JEUDI
        var X0 = 2400 + 20 * (4.25 - 2.62), V0 = 20, X1 = 3600, V1 = 5000, TW = DUR - 4.25;
        function camAt(t) {
          if (t < 0.66) return { x: 20 * t, y: 0, s: 1 + 0.02 * t };
          if (t < 0.78) { var e = EIO((t - 0.66) / 0.12); return { x: lerp(A.x, B.x, e), y: lerp(A.y, B.y, e), s: lerp(A.s, B.s, e) }; }
          if (t < 2.42) return { x: 96, y: 60 - 10 * (t - 0.78), s: 1.25 };
          if (t < 2.62) { var f = EIO((t - 2.42) / 0.2); return { x: lerp(C.x, D.x, f), y: lerp(C.y, D.y, f), s: lerp(C.s, D.s, f) }; }
          if (t < 4.25) return { x: 2400 + 20 * (t - 2.62), y: 0, s: 1 };
          // whip vers LUNDI : Hermite (x0, v0) -> (3600, +5000 u/s) à 4.46
          var u = Math.min(1, (t - 4.25) / TW), u2 = u * u, u3 = u2 * u;
          var x = (2 * u3 - 3 * u2 + 1) * X0 + (u3 - 2 * u2 + u) * TW * V0 + (-2 * u3 + 3 * u2) * X1 + (u3 - u2) * TW * V1;
          return { x: x, y: 0, s: 1 };
        }
        var lens = $("p01-lens");
        var blurP = { v: 0 };
        function apply() {
          var t = tl.time(), c = camAt(t);
          jiCam(world, { x: c.x, y: c.y, s: c.s, r: 0 });
          jiCam(back, { x: c.x * 0.6, y: c.y * 0.6, s: c.s * 0.72, r: 0 });
          jiCam(fg, { x: c.x * 1.6, y: c.y * 1.6, s: c.s * 1.35, r: 0 });
          jiBlur(lens, blurP.v);
        }

        var tl = gsap.timeline({ paused: true, onUpdate: apply });

        /* flou de lentille : cran (6 px), whip MARDI -> JEUDI (12 px), whip suivant (10 px à 4.46) */
        tl.fromTo(blurP, { v: 0 }, { v: 6, duration: 0.06, ease: "power2.in", immediateRender: false }, 0.66)
          .to(blurP, { v: 0, duration: 0.06, ease: "power2.out" }, 0.72)
          .to(blurP, { v: 12, duration: 0.1, ease: "power2.in" }, 2.42)
          .to(blurP, { v: 0, duration: 0.1, ease: "power2.out" }, 2.52)
          .to(blurP, { v: 10, duration: TW, ease: "power2.in" }, 4.25);

        /* ===== Scene 1 (0.00 à 0.62) : MARDI fonce de la caméra ===== */
        var mardi = $("p01-mardi");
        tl.fromTo(mardi, { x: 420, y: 300, scale: 3, rotation: -6, filter: "blur(12px)", transformOrigin: "50% 50%" },
          { x: 0, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 0);
        tl.fromTo("#p01-shadow", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1.05, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.25);
        tl.fromTo("#p01-fg", { opacity: 0, x: -260 }, { opacity: 0.85, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.12);
        tl.fromTo("#p01-rib-r", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 0.3);
        tl.fromTo("#p01-rib-l", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 0.3);
        tl.fromTo(root.querySelectorAll(".p01-back"), { opacity: 0 }, { opacity: 0.5, duration: 0.4, ease: "power2.out", stagger: 0.06, immediateRender: false }, 0.3);
        var hcs = root.querySelectorAll(".p01-hc");
        for (var h = 0; h < hcs.length; h++) tl.fromTo(hcs[h], { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.08, ease: "power2.out", immediateRender: false }, 0.45 + h * 0.04);
        jiSubAnim(tl, sub1, [0.06, 0.06], { boxAt: 0.04, outAt: 0.48 });

        /* ===== Scene 2 (0.62 à 2.42) : le téléphone attend le rappel ===== */
        tl.fromTo("#p01-phonewrap", { opacity: 0, scale: 0.8625, filter: "blur(8px)", transformOrigin: "50% 50%" },
          { opacity: 1, scale: 0.75, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, 0.70);
        jiPillBorn(tl, $("p01-pill1"), 1.10);
        jiPillPulse(tl, $("p01-pill1"), 1.26, 4);
        // l'heure laisse place à l'horloge, qui tourne vite 10:00 -> 17:30
        tl.to(hr, { opacity: 0, scale: 0.7, duration: 0.1, ease: "power2.in" }, 1.28);
        tl.fromTo("#p01-clock", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "expo.out", immediateRender: false }, 1.32);
        tl.fromTo("#p01-hh", { rotation: 300, svgOrigin: "42 42" }, { rotation: 525, svgOrigin: "42 42", duration: 0.8, ease: "power2.inOut", immediateRender: true }, 1.40);
        tl.fromTo("#p01-mh", { rotation: 0, svgOrigin: "42 42" }, { rotation: 2700, svgOrigin: "42 42", duration: 0.8, ease: "power2.inOut", immediateRender: true }, 1.40);
        tl.fromTo("#p01-dim", { opacity: 0 }, { opacity: 0.38, duration: 0.18, ease: "power2.out", immediateRender: false }, 2.20);
        jiSubAnim(tl, sub2, [0.68, 0.84, 1.32, 1.40, 1.72, 1.80], { boxAt: 1.29, outAt: 2.28 });

        /* ===== Scene 3 (2.42 à 4.46) : JEUDI, le loyer attendu ===== */
        tl.fromTo("#p01-jeudi", { opacity: 0, scale: 1.1, y: -24, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: "expo.out", immediateRender: false }, 2.55);
        tl.fromTo("#p01-card", { opacity: 0, scale: 1.15, filter: "blur(6px)", transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 2.90);
        var cols = root.querySelectorAll(".p01-col");
        for (var c2 = 0; c2 < cols.length; c2++) tl.fromTo(cols[c2], { y: 0 }, { y: -1300, duration: 0.55, ease: "power3.out", immediateRender: false }, 2.94 + c2 * 0.06);
        jiPillBorn(tl, $("p01-pill2"), 3.45);
        jiPillPulse(tl, $("p01-pill2"), 3.55, 1);
        tl.to("#p01-amount", { opacity: 0.2, duration: 0.07, ease: "power2.in" }, 3.91)
          .to("#p01-amount", { opacity: 1, duration: 0.12, ease: "power2.out" }, 3.98);
        jiSubAnim(tl, sub3, [2.59, 3.15, 3.31, 3.79, 3.91, 3.91], { boxAt: 3.76, outAt: 4.22 });

        tl.set({}, {}, DUR);
        apply();
        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
