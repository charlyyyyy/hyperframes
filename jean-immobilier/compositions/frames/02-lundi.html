/* sous-titre : words = ["Mardi,"] ; box = [i, j] indices (inclus) des mots dans la boîte ; stroke = [i, j] sous le trait */
function jiSubHTML(p, words, opt) {
  opt = opt || {}; var h = "", i = 0;
  function span(k) { return '<span class="ji-w ' + p + '-w">' + words[k] + "</span>"; }
  while (i < words.length) {
    var g = opt.box && i === opt.box[0] ? ["box", opt.box[1]] : opt.stroke && i === opt.stroke[0] ? ["stroke", opt.stroke[1]] : null;
    if (g) {
      var inner = []; for (var k = i; k <= g[1]; k++) inner.push(span(k));

        (g[0] === "stroke" ? '<i class="ji-stroke ' + p + '-stroke"></i>' : "") + "</span>";
      i = g[1] + 1;
    } else { h += span(i); i++; }
    if (i < words.length) h += " ";
  }
  return h;
}
/* anime le sous-titre : cues (temps locaux) par mot ; boxAt / strokeAt optionnels ; outAt = sortie (0,14 s) */
function jiSubAnim(tl, subEl, cues, o) {
  o = o || {};
  var ws = subEl.querySelectorAll(".ji-w");
  for (var i = 0; i < ws.length; i++) {
    tl.fromTo(ws[i], { opacity: 0, y: 8, filter: "blur(6px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, Math.max(0, cues[i] - 0.03));

  if (box && o.boxAt != null) {
    tl.fromTo(box, { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, o.boxAt);
    var inBox = box.parentNode.querySelectorAll(".ji-w");

function jiPillPulse(tl, pillEl, t, n) {

  '<div class="ji-a" style="left:330px;top:450px">' + jiPillHTML("p02-fp2", "En attente") + "</div>";

/* sous-titres (mot par mot) */
var s1 = $("p02-sub1"), s2 = $("p02-sub2");
s1.innerHTML = jiSubHTML("p02-a", ["Lundi", "…"], { box: [0, 0] }).replace("</span> <span", "</span><span");
s2.innerHTML = jiSubHTML("p02-b", ["vous", "attendez", "encore", "le", "compte", "rendu", "du", "syndic."], { stroke: [2, 2] });

/* ---- caméra : objet {x, y, s, r} appliqué par jiCam ; setters fonction => seek-safe même sans onUpdate ---- */
var world = $("p02-world"), lens = $("p02-lens"), far = $("p02-far");
var cam = { x: 3600, y: 0, s: 1, r: 0 }, lensBlur = 10;
function apply() {
  jiCam(world, cam);
  /* parallaxe du plan lointain : il suit la caméra à 12 % et grossit à 25 % du cran */
  var fx = -(cam.x - 4797) * 0.12, fs = 1 + (cam.s - 1) * 0.25;
  far.style.transform = "translate(" + fx.toFixed(2) + "px,0px) scale(" + fs.toFixed(4) + ")";
}
var rig = {
  x: function (v) { if (arguments.length) { cam.x = v; apply(); } return cam.x; },
  y: function (v) { if (arguments.length) { cam.y = v; apply(); } return cam.y; },
  s: function (v) { if (arguments.length) { cam.s = v; apply(); } return cam.s; },
  blur: function (v) { if (arguments.length) { lensBlur = v; jiBlur(lens, v); } return lensBlur; }
};
apply(); jiBlur(lens, lensBlur);

gsap.set("#p02-ph", { scale: 0.72, transformOrigin: "50% 50%" });
gsap.set("#p02-fgt", { scale: 0.55, transformOrigin: "0 0" });

var tl = gsap.timeline({ paused: true });

/* fin du whip : départ à +5000 u/s (v0 = 1.8 × 1190 / 0.43), décélère jusqu'à LUNDI */
var whipOut = function (p) { return 1 - Math.pow(1 - p, 1.8); };
tl.fromTo(rig, { x: 3600 }, { x: 4790, duration: 0.43, ease: whipOut }, 0);
tl.fromTo(rig, { blur: 10 }, { blur: 0, duration: 0.36, ease: function (p) { return 1 - Math.pow(1 - p, 1.6); } }, 0);
/* dérive x +20 u/s */
tl.to(rig, { x: 4797.2, duration: 0.36, ease: "none" }, 0.43);
/* cran ×1,3 sur l'écran du téléphone (expo.inOut 0,13 s, flou au milieu) */
tl.to(rig, { x: 4800, y: 30, s: 1.3, duration: 0.13, ease: "expo.inOut" }, 0.79);
tl.to(rig, { blur: 8, duration: 0.065, ease: "power2.in" }, 0.79);
tl.to(rig, { blur: 0, duration: 0.065, ease: "power2.out" }, 0.855);
/* dérive échelle +2 %/s */
tl.to(rig, { s: 1.3444, duration: 2.22, ease: "none" }, 0.92);
/* plongée vers l'écran : finit à cam(4800, 0, 1.60) en pleine vitesse (+2,0/s), flou 8 px */
var diveIn = function (p) { return Math.pow(p, 1.875); };
tl.to(rig, { s: 1.6, y: 0, duration: 0.24, ease: diveIn }, 3.14);
tl.to(rig, { blur: 8, duration: 0.24, ease: "power2.in" }, 3.14);

/* Scene 4 : 0.09 la tuile LUNDI se pose */
tl.fromTo("#p02-tl", { scale: 1 }, { scale: 1.03, duration: 0.09, ease: "power1.in" }, 0);
tl.to("#p02-tl", { scale: 1, duration: 0.32, ease: "expo.out" }, 0.09);
/* 0.24 « semaine suivante » glisse au-dessus du ruban */
tl.fromTo("#p02-week", { x: -70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, 0.24);
/* plan lointain : apparaît sous la fin du flou, puis 0.44 les pastilles pulsent encore */
tl.fromTo(far, { opacity: 0 }, { opacity: 0.6, duration: 0.24, ease: "power2.out", immediateRender: false }, 0.2);
jiPillPulse(tl, $("p02-fp1"), 0.44, 4);
jiPillPulse(tl, $("p02-fp2"), 0.5, 4);
/* sous-titre 1 : « Lundi… » (boîte sur Lundi) */
jiSubAnim(tl, s1, [0.22, 0.22], { boxAt: 0.17, outAt: 0.62 });

/* Scene 5 : profondeur de champ : tuile et lointain se défocalisent, le téléphone reste net */
tl.to("#p02-tl", { "--dof": "2px", opacity: 0.82, duration: 0.5, ease: "power2.inOut" }, 0.79);
tl.to("#p02-far-in", { "--dof": "14px", duration: 0.5, ease: "power2.inOut" }, 0.79);
tl.to(far, { opacity: 0.42, duration: 0.5, ease: "power2.inOut" }, 0.79);
/* 0.84 le téléphone se pose (glisse avec le ruban, ×1,15 flou → net), appli Mail */
tl.fromTo("#p02-ph", { x: -60, scale: 0.72 * 1.15, opacity: 0, filter: "blur(6px)" },
  { x: 0, scale: 0.72, opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out", immediateRender: false }, 0.82);
/* curseur de recherche puis frappe « compte rendu AG » (1.24 → 1.64) */
var caret = $("p02-caret");
[[1.0, 1], [1.16, 0], [1.24, 1], [1.84, 0], [2.02, 1], [2.2, 0], [2.38, 1], [2.56, 0], [2.74, 1], [2.92, 0], [3.1, 1]].forEach(function (k) {
  tl.set(caret, { opacity: k[1] }, k[0]);
});
var chs = world.querySelectorAll(".p02-ch");
for (var i = 0; i < chs.length; i++) tl.set(chs[i], { display: "inline" }, 1.24 + i * (0.4 / chs.length));
/* 1.59 pastille d'attente (signature 1), puis ses points pulsent */
jiPillBorn(tl, $("p02-pl"), 1.59);
jiPillPulse(tl, $("p02-pl"), 1.76, 2);
/* 2.14 « Aucun résultat » tombe dans la liste */
tl.fromTo("#p02-none", { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 2.12);
tl.fromTo(["#p02-hr", "#p02-row"], { y: 10, opacity: 0 }, { y: 0, opacity: 0.32, duration: 0.24, ease: "power3.out", immediateRender: false }, 2.3);
/* 2.84 la dernière ligne « Syndic · Convocation AG · il y a 3 mois » s'allume */
tl.to("#p02-row", { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.83);
tl.fromTo("#p02-row-bg", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, 2.83);
tl.to("#p02-hr", { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.83);
/* 3.14 le téléphone sonne : vibration 2 px (finie), départ de la plongée */
tl.fromTo("#p02-vib", { x: 0 }, { x: 2.2, duration: 0.2, ease: function (p) { return Math.sin(p * Math.PI * 14) * (1 - p); }, immediateRender: false }, 3.14);
/* sous-titre 2 : trait sous « encore » ; sortie avant la couture (aucune phrase à 3.38) */
jiSubAnim(tl, s2, [0.83, 1.07, 1.75, 2.03, 2.15, 2.35, 2.71, 2.83], { strokeAt: 1.75, outAt: 3.12 });

tl.set({}, {}, D);
window.__timelines = window.__timelines || {};
